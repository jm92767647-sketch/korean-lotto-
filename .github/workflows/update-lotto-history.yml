name: Update lotto history
on:
  schedule:
    - cron: '15 13 * * 6'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lotto-history-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/nine.test.cjs
      - run: node scripts/update-history.cjs
      - name: Commit validated new draws only
        run: |
          if git diff --quiet -- lotto_history.json history-data.js history-provenance.json; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lotto_history.json history-data.js history-provenance.json
          git commit -m 'Update validated lotto history'
          git push
